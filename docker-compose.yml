services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scoper
      POSTGRES_PASSWORD: scoper
      POSTGRES_DB: scoper
    ports:
      - "5440:5432"   # 5440 on the host avoids ports used by other local Postgres containers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoper"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
