[project]
name = "scoper"
version = "0.1.0"
description = "Client brief scoper: grounded, human-approved project scoping with LLMs"
readme = "README.md"
authors = [
    { name = "Gustavo", email = "gguerreiro95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "dspy>=3.4.1,<3.5",
    "fastapi>=0.162.0",
    "openai>=3.39.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model provider", "db: needs the docker compose Postgres"]
filterwarnings = [
    "ignore:Implementing custom LMs:DeprecationWarning",
    "ignore:Passing OpenAI-style:DeprecationWarning",
]
addopts = "-m 'not live and not db'"

[tool.ruff]
line-length = 100
