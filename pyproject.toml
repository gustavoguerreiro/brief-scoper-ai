[project]
name = "scoper"
version = "0.1.0"
description = "Client brief scoper: grounded, human-approved project scoping with LLMs"
readme = "README.md"
authors = [
    { name = "Gustavo", email = "gguerreiro95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model provider (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
